<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1500" viewBox="0 0 1280 1500" role="img" aria-labelledby="title desc">
  <title id="title">种草软件 v1 UI 元素示意图</title>
  <desc id="desc">展示收件箱、想去、日历、已去过、我的五个页面，以及通用卡片、标签、Toast、表单和底部导航组件关系。</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f2; }
      .panel { fill: #ffffff; stroke: #d9ded5; stroke-width: 2; }
      .soft { fill: #fbfcf8; stroke: #d9ded5; stroke-width: 2; }
      .primary { fill: #26342f; }
      .sky { fill: #d8ecf2; }
      .leaf { fill: #dcede2; }
      .tomato { fill: #ffe3da; stroke: #ef6f4c; stroke-width: 2; }
      .line { stroke: #d9ded5; stroke-width: 2; }
      .text { fill: #1c2420; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 24px; }
      .small { fill: #69736d; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 18px; }
      .tiny { fill: #69736d; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 15px; }
      .white { fill: #ffffff; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; }
      .title { fill: #1c2420; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 36px; font-weight: 800; }
      .section { fill: #26342f; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 26px; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1500"/>
  <text x="60" y="72" class="title">种草软件 v1 UI 元素示意图</text>
  <text x="60" y="110" class="small">轻量清爽 · 手机优先 · 保存 → 整理 → 筛选 → 计划 → 轻反馈</text>

  <rect x="60" y="150" width="1160" height="132" rx="18" class="panel"/>
  <text x="90" y="192" class="section">App Shell</text>
  <rect x="90" y="210" width="260" height="42" rx="21" class="sky"/>
  <text x="112" y="237" class="small">顶部标题 + 待整理数量</text>
  <rect x="390" y="210" width="500" height="42" rx="21" class="leaf"/>
  <text x="414" y="237" class="small">内容区：单列卡片、表单、筛选</text>
  <rect x="930" y="210" width="250" height="42" rx="21" class="primary"/>
  <text x="956" y="237" class="white">底部 5 Tab 导航</text>

  <text x="60" y="340" class="section">五个核心页面</text>

  <rect x="60" y="370" width="220" height="420" rx="18" class="panel"/>
  <text x="86" y="410" class="section">收件箱</text>
  <rect x="86" y="438" width="168" height="40" rx="8" class="soft"/>
  <text x="102" y="464" class="tiny">种草链接输入</text>
  <rect x="86" y="494" width="168" height="40" rx="8" class="soft"/>
  <text x="102" y="520" class="tiny">标题/店名/菜名</text>
  <rect x="86" y="550" width="168" height="56" rx="8" class="soft"/>
  <text x="102" y="584" class="tiny">备注</text>
  <rect x="86" y="624" width="168" height="44" rx="8" class="primary"/>
  <text x="116" y="652" class="white">保存</text>
  <line x1="86" y1="694" x2="254" y2="694" class="line"/>
  <text x="86" y="728" class="small">线索卡片</text>
  <text x="86" y="758" class="tiny">解析状态 · 重新解析 · 快速整理</text>

  <rect x="300" y="370" width="300" height="420" rx="18" class="panel"/>
  <text x="326" y="410" class="section">想去</text>
  <rect x="326" y="438" width="248" height="42" rx="21" class="soft"/>
  <text x="346" y="465" class="tiny">搜索框 + 标签 Chip</text>
  <rect x="326" y="504" width="248" height="206" rx="14" class="soft"/>
  <rect x="342" y="524" width="72" height="72" rx="12" class="sky"/>
  <text x="434" y="548" class="text">店铺/菜品卡片</text>
  <text x="434" y="580" class="tiny">名称 · 商圈 · 标签 · 状态</text>
  <rect x="342" y="620" width="216" height="38" rx="8" class="primary"/>
  <text x="412" y="645" class="white">加入日历</text>
  <rect x="342" y="672" width="216" height="24" rx="12" class="leaf"/>
  <text x="386" y="690" class="tiny">轻反馈/编辑折叠</text>
  <text x="326" y="748" class="small">默认减负：只外露主操作</text>

  <rect x="620" y="370" width="260" height="420" rx="18" class="panel"/>
  <text x="646" y="410" class="section">日历</text>
  <rect x="646" y="438" width="208" height="116" rx="14" class="soft"/>
  <rect x="666" y="462" width="70" height="70" rx="10" class="sky"/>
  <text x="678" y="502" class="tiny">6月</text>
  <text x="750" y="482" class="small">计划卡</text>
  <text x="750" y="512" class="tiny">对象名称</text>
  <rect x="646" y="582" width="208" height="42" rx="8" class="soft"/>
  <text x="692" y="609" class="tiny">改期</text>
  <rect x="646" y="642" width="96" height="42" rx="8" class="soft"/>
  <text x="660" y="669" class="tiny">放回想去</text>
  <rect x="758" y="642" width="96" height="42" rx="8" class="tomato"/>
  <text x="772" y="669" class="tiny">不想去了</text>
  <rect x="646" y="708" width="208" height="42" rx="8" class="leaf"/>
  <text x="676" y="735" class="tiny">还想去 / 一般 / 不再去</text>

  <rect x="900" y="370" width="260" height="420" rx="18" class="panel"/>
  <text x="926" y="410" class="section">已去过</text>
  <rect x="926" y="442" width="208" height="150" rx="14" class="soft"/>
  <rect x="946" y="470" width="70" height="70" rx="10" class="sky"/>
  <text x="954" y="510" class="tiny">日期</text>
  <text x="1030" y="486" class="small">反馈卡</text>
  <rect x="1030" y="510" width="78" height="28" rx="14" class="leaf"/>
  <text x="1046" y="529" class="tiny">一般</text>
  <rect x="1056" y="548" width="38" height="38" rx="8" class="soft"/>
  <text x="1069" y="574" class="tiny">×</text>
  <text x="926" y="632" class="small">撤销轻反馈</text>
  <text x="926" y="662" class="tiny">恢复被完成的日历计划</text>

  <rect x="60" y="830" width="380" height="270" rx="18" class="panel"/>
  <text x="86" y="870" class="section">我的</text>
  <rect x="86" y="900" width="328" height="38" rx="19" class="leaf"/>
  <text x="108" y="925" class="tiny">标签管理：默认 + 自定义</text>
  <rect x="86" y="954" width="328" height="38" rx="19" class="sky"/>
  <text x="108" y="979" class="tiny">不想去了：放回想去</text>
  <rect x="86" y="1008" width="328" height="38" rx="19" class="soft"/>
  <text x="108" y="1033" class="tiny">回收站：恢复误删内容</text>
  <rect x="86" y="1062" width="328" height="24" rx="12" class="soft"/>
  <text x="108" y="1080" class="tiny">本地数据版本</text>

  <rect x="470" y="830" width="690" height="270" rx="18" class="panel"/>
  <text x="496" y="870" class="section">全局组件</text>
  <rect x="496" y="900" width="130" height="44" rx="8" class="primary"/>
  <text x="528" y="928" class="white">主按钮</text>
  <rect x="650" y="900" width="130" height="44" rx="8" class="soft"/>
  <text x="682" y="928" class="tiny">次按钮</text>
  <rect x="804" y="900" width="88" height="34" rx="17" class="leaf"/>
  <text x="828" y="922" class="tiny">Chip</text>
  <rect x="916" y="900" width="44" height="44" rx="8" class="soft"/>
  <text x="930" y="929" class="tiny">↻</text>
  <text x="984" y="928" class="tiny">图标按钮 + aria-label</text>

  <rect x="496" y="970" width="300" height="64" rx="8" class="soft"/>
  <text x="518" y="995" class="tiny">输入框</text>
  <text x="518" y="1020" class="tiny">外置 label + placeholder 示例</text>
  <rect x="826" y="970" width="300" height="64" rx="8" class="primary"/>
  <text x="850" y="1008" class="white">Toast：消息 + 撤销</text>
  <text x="496" y="1074" class="tiny">空状态：行动导向文案</text>
  <text x="826" y="1074" class="tiny">焦点：focus-visible；触控：touch-action</text>

  <text x="60" y="1180" class="section">关键交互流</text>
  <rect x="60" y="1210" width="190" height="58" rx="29" class="primary"/>
  <text x="102" y="1247" class="white">保存线索</text>
  <path d="M250 1239 H320" class="line"/>
  <rect x="320" y="1210" width="190" height="58" rx="29" class="sky"/>
  <text x="362" y="1247" class="text">整理</text>
  <path d="M510 1239 H580" class="line"/>
  <rect x="580" y="1210" width="190" height="58" rx="29" class="leaf"/>
  <text x="622" y="1247" class="text">筛选</text>
  <path d="M770 1239 H840" class="line"/>
  <rect x="840" y="1210" width="190" height="58" rx="29" class="sky"/>
  <text x="882" y="1247" class="text">计划</text>
  <path d="M1030 1239 H1100" class="line"/>
  <rect x="1100" y="1210" width="120" height="58" rx="29" class="leaf"/>
  <text x="1122" y="1247" class="text">反馈</text>

  <rect x="60" y="1320" width="1160" height="96" rx="18" class="tomato"/>
  <text x="90" y="1360" class="section">恢复路径</text>
  <text x="90" y="1398" class="small">误删/误撤销轻反馈 → Toast 直接撤销；过期后 → 我的/回收站恢复；不想去了 → 我的/放回想去。</text>
</svg>
